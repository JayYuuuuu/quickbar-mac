<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    *{box-sizing:border-box}
    body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC",system-ui,sans-serif;-webkit-font-smoothing:antialiased;font-size:13px;letter-spacing:-0.01em}
    a{color:#0a6cff}
    a:hover{color:#0850c4}
    .qb a{color:var(--accent)}
    .qb{
      --wall-a:#b9c6d4;--wall-b:#e4dcd1;--wall-c:#8fa3b8;
      --glass:rgba(249,249,251,.78);--glass-brd:rgba(0,0,0,.10);--glass-top:rgba(255,255,255,.7);
      --win:#f5f5f7;--win-brd:rgba(0,0,0,.13);--side:rgba(237,237,241,.72);--bar:rgba(246,246,248,.88);
      --fg:#17171a;--fg2:#77777f;--fg3:#a9a9b1;
      --sep:rgba(0,0,0,.08);--hover:rgba(0,0,0,.05);
      --accent:#0a6cff;--accent-soft:rgba(10,108,255,.13);--on-accent:#fff;
      --field:rgba(255,255,255,.92);--field-brd:rgba(0,0,0,.14);
      --ok:#28a54c;--warn:#e08c1a;
      --shadow:0 24px 56px rgba(18,20,26,.28),0 2px 6px rgba(18,20,26,.14);
      color:var(--fg);
    }
    .qb.dark{
      --wall-a:#2a3542;--wall-b:#3b352d;--wall-c:#161c25;
      --glass:rgba(45,45,50,.8);--glass-brd:rgba(255,255,255,.13);--glass-top:rgba(255,255,255,.12);
      --win:#1f1f23;--win-brd:rgba(255,255,255,.11);--side:rgba(37,37,42,.74);--bar:rgba(40,40,45,.88);
      --fg:#f2f2f5;--fg2:#9b9ba3;--fg3:#6d6d76;
      --sep:rgba(255,255,255,.085);--hover:rgba(255,255,255,.07);
      --accent:#3b82ff;--accent-soft:rgba(59,130,255,.2);--on-accent:#fff;
      --field:rgba(255,255,255,.07);--field-brd:rgba(255,255,255,.14);
      --ok:#35c25f;--warn:#f0a63c;
      --shadow:0 28px 64px rgba(0,0,0,.6),0 2px 8px rgba(0,0,0,.45);
    }
    .wall{position:absolute;inset:0;background:
      radial-gradient(90% 70% at 16% 8%, var(--wall-b) 0%, transparent 58%),
      radial-gradient(80% 65% at 88% 14%, var(--wall-a) 0%, transparent 62%),
      linear-gradient(158deg, var(--wall-c) 0%, var(--wall-a) 52%, var(--wall-b) 100%)}
    .row{display:flex;align-items:center;gap:8px;height:28px;padding:0 8px;border-radius:7px}
    .grp{font-size:10.5px;font-weight:600;color:var(--fg3);padding:8px 9px 3px;letter-spacing:.02em}
    .kbd{display:inline-flex;align-items:center;justify-content:center;min-width:17px;height:17px;padding:0 4px;border-radius:4px;background:var(--hover);color:var(--fg2);font-size:10.5px;font-weight:500}
    .nm{font-size:13px;white-space:nowrap}
    .pt{font-size:11px;color:var(--fg2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:158px}
    .sec{font-size:11px;font-weight:600;color:var(--fg2);padding:0 0 8px 2px}
    .card{background:var(--field);border:.5px solid var(--field-brd);border-radius:9px}
  </style>
</helmet>
<div class="{{themeClass}}" style="position:relative;width:560px;height:420px;overflow:hidden">
  <div class="wall"></div>

  <!-- 菜单栏 -->
  <div style="position:absolute;left:0;right:0;top:0;height:28px;background:var(--bar);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-bottom:.5px solid var(--sep);display:flex;align-items:center;padding:0 12px;gap:14px">
    <span style="font-size:12.5px;font-weight:600">Finder</span>
    <span style="font-size:12.5px;color:var(--fg2)">文件</span>
    <span style="font-size:12.5px;color:var(--fg2)">编辑</span>
    <span style="flex:1"></span>

    <!-- QuickBar 菜单栏图标（激活态） -->
    <span style="display:inline-flex;align-items:center;justify-content:center;width:26px;height:20px;border-radius:5px;background:var(--accent)">
      <svg width="15" height="15" viewBox="0 0 16 16" fill="none">
        <rect x="2.5" y="3.6" width="7" height="1.8" rx=".9" fill="#fff"/>
        <rect x="2.5" y="7.1" width="9.5" height="1.8" rx=".9" fill="#fff" opacity=".8"/>
        <rect x="2.5" y="10.6" width="5.5" height="1.8" rx=".9" fill="#fff" opacity=".6"/>
        <path d="M11.4 10.1 13.5 12l-2.1 1.9" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </span>

    <svg width="16" height="12" viewBox="0 0 16 12" fill="none" style="opacity:.65"><path d="M1 4.2a10 10 0 0 1 14 0M3.4 6.8a6.6 6.6 0 0 1 9.2 0M6 9.4a3 3 0 0 1 4 0" stroke="var(--fg)" stroke-width="1.4" stroke-linecap="round"/></svg>
    <svg width="22" height="11" viewBox="0 0 24 12" fill="none" style="opacity:.65"><rect x=".8" y=".8" width="19" height="10.4" rx="3" stroke="var(--fg)" stroke-width="1.2"/><rect x="2.6" y="2.6" width="13" height="6.8" rx="1.6" fill="var(--fg)"/><path d="M21.6 4.4v3.2" stroke="var(--fg)" stroke-width="1.6" stroke-linecap="round"/></svg>
    <span style="font-size:12px;color:var(--fg)">周四 15:52</span>
  </div>

  <!-- 下拉菜单 -->
  <div style="position:absolute;right:64px;top:34px;width:238px;border-radius:11px;background:var(--glass);backdrop-filter:blur(34px) saturate(1.8);-webkit-backdrop-filter:blur(34px) saturate(1.8);border:.5px solid var(--glass-brd);box-shadow:var(--shadow);padding:5px;overflow:hidden">
    <div style="height:1px;background:var(--glass-top);margin:-5px -5px 4px"></div>

    <div class="row" style="height:24px;padding:0 9px">
      <span style="font-size:12.5px">暂停触发</span>
      <span style="flex:1"></span>
      <span style="font-size:12px;color:var(--fg3)">⌥⌘P</span>
    </div>

    <div class="row" style="height:24px;padding:0 9px">
      <span style="font-size:12.5px">跳到 Finder 当前</span>
      <span style="flex:1"></span>
      <span style="font-size:12px;color:var(--fg3)">⌘G</span>
    </div>

    <div style="height:.5px;background:var(--sep);margin:4px 9px"></div>

    <div class="row" style="height:24px;padding:0 9px;background:var(--accent);color:var(--on-accent)">
      <span style="font-size:12.5px">设置…</span>
      <span style="flex:1"></span>
      <span style="font-size:12px;opacity:.75">⌘,</span>
    </div>

    <div class="row" style="height:24px;padding:0 9px" title="辅助功能、输入监控、自动化(Finder) 三项都在——任何一项掉了这里会变橙色">
      <span style="width:6px;height:6px;border-radius:4px;background:var(--ok);flex:none"></span>
      <span style="font-size:12.5px;color:var(--fg2)">权限正常</span>
    </div>

    <div style="height:.5px;background:var(--sep);margin:4px 9px"></div>

    <div class="row" style="height:24px;padding:0 9px">
      <span style="font-size:12.5px">退出 QuickBar</span>
      <span style="flex:1"></span>
      <span style="font-size:12px;color:var(--fg3)">⌘Q</span>
    </div>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"dark": {"editor": "boolean", "default": false, "section": "外观"}, "$preview": {"width": 560, "height": 420}}'>
class Component extends DCLogic {
  renderVals() {
    return { themeClass: this.props.dark ? 'qb dark' : 'qb' };
  }
}
</script>
</body>
</html>
