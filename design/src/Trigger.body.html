<div class="{{themeClass}}" style="position:relative;width:760px;height:520px;overflow:hidden">
  <div class="wall" style="opacity:.85"></div>

  <div style="position:absolute;left:30px;top:28px;width:700px;height:464px;border-radius:12px;background:var(--win);border:.5px solid var(--win-brd);box-shadow:0 26px 60px rgba(0,0,0,.34);display:flex;flex-direction:column;overflow:hidden">

    <div style="display:flex;align-items:center;gap:9px;height:48px;padding:0 18px;border-bottom:.5px solid var(--sep);flex:none">
      <span style="width:11px;height:11px;border-radius:6px;background:#ff5f57"></span>
      <span style="width:11px;height:11px;border-radius:6px;background:#febc2e"></span>
      <span style="width:11px;height:11px;border-radius:6px;background:#28c840"></span>
      <span style="margin-left:12px;font-size:14px;font-weight:600">QuickBar 设置</span>
    </div>

    <div style="flex:1;display:flex;min-height:0">
      <div style="width:172px;background:var(--side);border-right:.5px solid var(--sep);padding:8px;display:flex;flex-direction:column;gap:2px">
        <div class="row" style="height:28px">
          <svg width="17" height="17" viewBox="0 0 16 16" fill="none" style="flex:none"><path d="M2.5 4.6c0-.7.56-1.26 1.25-1.26h2.3c.33 0 .65.13.88.37l.6.6c.24.23.56.37.89.37h4.33c.69 0 1.25.56 1.25 1.25v5.9c0 .7-.56 1.26-1.25 1.26H3.75c-.69 0-1.25-.56-1.25-1.25z" stroke="var(--fg2)" stroke-width="1.4"/></svg>
          <span style="font-size:13px">条目</span>
        </div>
        <div class="row" style="height:28px;background:var(--accent);color:var(--on-accent)">
          <svg width="17" height="17" viewBox="0 0 16 16" fill="none" style="flex:none"><path d="M3.4 3.4a6.5 6.5 0 0 0 0 9.2" stroke="#fff" stroke-width="1.4" stroke-linecap="round"/><circle cx="8.6" cy="8" r="1.8" fill="#fff"/><path d="M11.6 5a4.2 4.2 0 0 1 0 6" stroke="#fff" stroke-width="1.4" stroke-linecap="round"/></svg>
          <span style="font-size:13px">触发</span>
        </div>
        <div class="row" style="height:28px">
          <svg width="17" height="17" viewBox="0 0 16 16" fill="none" style="flex:none"><path d="M8 1.8 13.2 4v3.7c0 3.2-2.1 5.6-5.2 6.5-3.1-.9-5.2-3.3-5.2-6.5V4z" stroke="var(--fg2)" stroke-width="1.4" stroke-linejoin="round"/></svg>
          <span style="font-size:13px">权限</span><span style="flex:1"></span><span style="width:6px;height:6px;border-radius:4px;background:var(--warn)"></span>
        </div>
        <div class="row" style="height:28px">
          <svg width="17" height="17" viewBox="0 0 16 16" fill="none" style="flex:none"><circle cx="8" cy="8" r="2.3" stroke="var(--fg2)" stroke-width="1.4"/><path d="M8 1.6v1.8M8 12.6v1.8M14.4 8h-1.8M3.4 8H1.6M12.5 3.5l-1.3 1.3M4.8 11.2l-1.3 1.3M12.5 12.5l-1.3-1.3M4.8 4.8 3.5 3.5" stroke="var(--fg2)" stroke-width="1.4" stroke-linecap="round"/></svg>
          <span style="font-size:13px">通用</span>
        </div>
      </div>

      <div style="flex:1;display:flex;flex-direction:column;min-width:0">
        <div style="display:flex;align-items:center;height:44px;padding:0 16px;border-bottom:.5px solid var(--sep);flex:none">
          <span style="font-size:13px;font-weight:600">触发</span>
        </div>
        <div style="flex:1;padding:14px 16px;display:flex;flex-direction:column;gap:16px;overflow:hidden">
          <div>
            <div class="sec">唤出快捷条</div>
            <div class="card" style="padding:4px">
              <div class="row" style="height:34px;gap:9px">
                <span style="width:14px;height:14px;border-radius:8px;background:var(--accent);display:grid;place-items:center;flex:none"><span style="width:5px;height:5px;border-radius:3px;background:#fff"></span></span><span style="font-size:12.5px">修饰键 + 双击</span><span style="flex:1"></span>
                <span style="display:flex;padding:2px;border-radius:7px;background:var(--hover);gap:2px" title="按住这个键再双击才会弹出快捷条"><span style="display:inline-flex;align-items:center;justify-content:center;width:30px;height:20px;border-radius:5px;background:var(--accent);color:var(--on-accent);font-weight:600;font-size:11px">⌥</span><span style="display:inline-flex;align-items:center;justify-content:center;width:30px;height:20px;border-radius:5px;color:var(--fg2);font-size:11px">⌃</span><span style="display:inline-flex;align-items:center;justify-content:center;width:30px;height:20px;border-radius:5px;color:var(--fg2);font-size:11px">⌘</span><span style="display:inline-flex;align-items:center;justify-content:center;width:30px;height:20px;border-radius:5px;color:var(--fg2);font-size:11px">fn</span></span>
              </div>
              <div style="height:.5px;background:var(--sep);margin:0 8px"></div>
              <div class="row" style="height:34px;gap:9px">
                <span style="width:14px;height:14px;border-radius:8px;border:1.2px solid var(--fg3);flex:none"></span><span style="font-size:12.5px;color:var(--fg2)">双击桌面空白处</span><span style="flex:1"></span>
                <span style="font-size:11px;color:var(--fg3)" title="最安全，但别的应用全屏时用不了，得先回桌面">仅桌面</span>
              </div>
              <div style="height:.5px;background:var(--sep);margin:0 8px"></div>
              <div class="row" style="height:34px;gap:9px">
                <span style="width:14px;height:14px;border-radius:8px;border:1.2px solid var(--fg3);flex:none"></span><span style="font-size:12.5px;color:var(--fg2)">裸双击任意位置</span><span style="flex:1"></span>
                <span style="display:inline-flex;align-items:center;padding:0 7px;height:18px;border-radius:5px;background:rgba(224,140,26,.16);color:var(--warn);font-size:10.5px;font-weight:600" title="双击在 macOS 里到处有语义：文本选词、Finder 打开、标题栏最大化。开这个必然误触发">易误触发</span>
              </div>
              <div style="height:.5px;background:var(--sep);margin:0 8px"></div>
              <div class="row" style="height:34px;gap:9px">
                <span style="width:14px;height:14px;border-radius:8px;border:1.2px solid var(--fg3);flex:none"></span><span style="font-size:12.5px;color:var(--fg2)">连按两下 ⌘</span><span style="flex:1"></span>
                <span style="font-size:11px;color:var(--fg3)" title="完全不碰鼠标事件，零冲突">不碰鼠标</span>
              </div>
            </div>
          </div>

          <div>
            <div class="sec">快捷键</div>
            <div class="card" style="padding:4px">
              <div class="row" style="height:38px">
                <span style="font-size:12.5px">跳到 Finder 当前文件夹</span><span style="flex:1"></span>
                <span style="display:inline-flex;align-items:center;justify-content:center;min-width:52px;height:24px;padding:0 10px;border-radius:6px;background:var(--accent-soft);color:var(--accent);font-size:12px;font-weight:600" title="只在检测到文件面板时才拦截；其他场合这个键仍然是各应用自己的功能">⌘G</span>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
