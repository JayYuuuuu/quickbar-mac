<div class="{{themeClass}}" style="position:relative;width:720px;height:480px;overflow:hidden">
  <div class="wall"></div>

  <!-- 背景：浏览器窗口 + 上传面板（sheet） -->
  <div style="position:absolute;left:24px;top:30px;width:672px;height:424px;border-radius:11px;background:var(--win);border:.5px solid var(--win-brd);box-shadow:0 18px 44px rgba(0,0,0,.34);overflow:hidden">
    <div style="display:flex;align-items:center;gap:8px;height:36px;padding:0 12px;background:var(--bar);border-bottom:.5px solid var(--sep)">
      <span style="width:10px;height:10px;border-radius:6px;background:#ff5f57"></span>
      <span style="width:10px;height:10px;border-radius:6px;background:#febc2e"></span>
      <span style="width:10px;height:10px;border-radius:6px;background:#28c840"></span>
      <div style="margin-left:10px;display:flex;align-items:center;gap:6px;height:24px;padding:0 12px;border-radius:7px 7px 0 0;background:var(--field);font-size:11.5px;color:var(--fg2)">商品发布 · 图片上传</div>
    </div>

    <!-- 上传面板 sheet -->
    <div style="position:absolute;left:74px;top:36px;width:524px;height:334px;border-radius:0 0 12px 12px;background:var(--glass);backdrop-filter:blur(28px) saturate(1.6);-webkit-backdrop-filter:blur(28px) saturate(1.6);border:.5px solid var(--glass-brd);border-top:none;box-shadow:0 22px 48px rgba(0,0,0,.4);display:flex;flex-direction:column;overflow:hidden">
      <div style="display:flex;align-items:center;justify-content:center;height:34px;font-size:12.5px;font-weight:600;color:var(--fg2);border-bottom:.5px solid var(--sep)">打开</div>
      <div style="flex:1;display:flex;min-height:0">
        <div style="width:132px;padding:8px 6px;border-right:.5px solid var(--sep);display:flex;flex-direction:column;gap:1px">
          <div class="grp" style="padding:2px 8px 3px">个人收藏</div>
          <div class="row" style="height:24px;font-size:12px"><span style="width:13px;height:13px;border-radius:3px;background:#3d8ffd;flex:none"></span><span style="font-size:12px">最近使用</span></div>
          <div class="row" style="height:24px;font-size:12px"><span style="width:13px;height:13px;border-radius:3px;background:#3d8ffd;flex:none"></span><span style="font-size:12px">下载</span></div>
          <div class="row" style="height:24px;font-size:12px"><span style="width:13px;height:13px;border-radius:3px;background:#3d8ffd;flex:none"></span><span style="font-size:12px">桌面</span></div>
          <div class="row" style="height:24px;font-size:12px"><span style="width:13px;height:13px;border-radius:3px;background:#3d8ffd;flex:none"></span><span style="font-size:12px">文稿</span></div>
        </div>
        <div style="flex:1;padding:12px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;align-content:start">
          <div style="height:52px;border-radius:6px;background:var(--hover)"></div>
          <div style="height:52px;border-radius:6px;background:var(--hover)"></div>
          <div style="height:52px;border-radius:6px;background:var(--hover)"></div>
          <div style="height:52px;border-radius:6px;background:var(--hover)"></div>
          <div style="height:52px;border-radius:6px;background:var(--hover)"></div>
          <div style="height:52px;border-radius:6px;background:var(--hover)"></div>
        </div>
      </div>
      <div style="display:flex;align-items:center;gap:8px;padding:9px 12px;border-top:.5px solid var(--sep)">
        <span style="flex:1"></span>
        <span style="display:inline-flex;align-items:center;padding:0 14px;height:24px;border-radius:6px;background:var(--field);border:.5px solid var(--field-brd);font-size:12px;color:var(--fg2)">取消</span>
        <span style="display:inline-flex;align-items:center;padding:0 16px;height:24px;border-radius:6px;background:var(--accent);color:var(--on-accent);font-size:12px;font-weight:500">打开</span>
      </div>
    </div>
  </div>

  <!-- 快捷条：面板上下文态 -->
  <div style="position:absolute;left:366px;top:132px;width:300px;border-radius:14px;background:var(--glass);backdrop-filter:blur(34px) saturate(1.8);-webkit-backdrop-filter:blur(34px) saturate(1.8);border:.5px solid var(--glass-brd);box-shadow:var(--shadow);overflow:hidden">
    <div style="height:1px;background:var(--glass-top)"></div>

    <div style="display:flex;align-items:center;gap:6px;padding:9px 11px 7px" title="检测到当前聚焦窗口是文件面板（AXIdentifier = open-panel），动作自动从「打开」切成「跳转到此」">
      <span style="width:13px;height:13px;border-radius:3.5px;background:#4f7fd4;flex:none"></span>
      <span style="font-size:11.5px;color:var(--fg2);flex:1">上传窗 · Chrome</span>
      <span style="font-size:11px;color:var(--accent);font-weight:600">跳转</span>
    </div>

    <div style="padding:0 9px 4px">
      <div style="display:flex;align-items:center;gap:6px;height:27px;padding:0 9px;border-radius:8px;background:var(--field);border:.5px solid var(--field-brd)" title="支持拼音：「下载」可以输 xiazai，也可以只输首字母 xz">
        <svg width="12" height="12" viewBox="0 0 16 16" fill="none" style="flex:none"><circle cx="7" cy="7" r="4.6" stroke="var(--fg3)" stroke-width="1.5"/><path d="M10.6 10.6 14 14" stroke="var(--fg3)" stroke-width="1.5" stroke-linecap="round"/></svg>
        <span style="font-size:12.5px;color:var(--fg3)">输入即可筛选</span>
      </div>
    </div>

    <div style="padding:0 7px 6px">
      <!-- ⌘G 置顶项 -->
      <div class="row" style="background:var(--accent);color:var(--on-accent);height:34px">
        <svg width="18" height="18" viewBox="0 0 20 20" style="flex:none"><path d="M2 5.9c0-.94.76-1.7 1.7-1.7h3.2c.45 0 .88.18 1.2.5l.85.85c.32.32.75.5 1.2.5h6.1c.94 0 1.7.76 1.7 1.7v.55H2z" fill="#fff" fill-opacity=".55"/><path d="M2 7.6h16v6.5c0 .94-.76 1.7-1.7 1.7H3.7c-.94 0-1.7-.76-1.7-1.7z" fill="#fff" fill-opacity=".9"/></svg>
        <span style="display:flex;flex-direction:column;gap:1px;min-width:0">
          <span class="nm" style="line-height:1.15">项目素材</span>
          <span style="font-size:10.5px;color:rgba(255,255,255,.72);line-height:1.15">Finder 当前</span>
        </span>
        <span style="flex:1"></span>
        <span class="kbd" style="background:rgba(255,255,255,.22);color:#fff;min-width:26px">⌘G</span>
      </div>

      <div class="grp">文件夹</div>

      <div class="row">
        <svg width="18" height="18" viewBox="0 0 20 20" style="flex:none"><path d="M2 5.9c0-.94.76-1.7 1.7-1.7h3.2c.45 0 .88.18 1.2.5l.85.85c.32.32.75.5 1.2.5h6.1c.94 0 1.7.76 1.7 1.7v.55H2z" fill="#7fb4ff"/><path d="M2 7.6h16v6.5c0 .94-.76 1.7-1.7 1.7H3.7c-.94 0-1.7-.76-1.7-1.7z" fill="#3d8ffd"/></svg>
        <span class="nm">秋季新品</span>
        <span style="flex:1"></span>
        <span class="pt">~/Work</span>
      </div>

      <div class="row">
        <svg width="18" height="18" viewBox="0 0 20 20" style="flex:none"><path d="M2 5.9c0-.94.76-1.7 1.7-1.7h3.2c.45 0 .88.18 1.2.5l.85.85c.32.32.75.5 1.2.5h6.1c.94 0 1.7.76 1.7 1.7v.55H2z" fill="#7fb4ff"/><path d="M2 7.6h16v6.5c0 .94-.76 1.7-1.7 1.7H3.7c-.94 0-1.7-.76-1.7-1.7z" fill="#3d8ffd"/></svg>
        <span class="nm">待上传</span>
        <span style="flex:1"></span>
        <span class="pt">~/Work</span>
      </div>

      <div class="row">
        <svg width="18" height="18" viewBox="0 0 20 20" style="flex:none"><path d="M2 5.9c0-.94.76-1.7 1.7-1.7h3.2c.45 0 .88.18 1.2.5l.85.85c.32.32.75.5 1.2.5h6.1c.94 0 1.7.76 1.7 1.7v.55H2z" fill="#7fb4ff"/><path d="M2 7.6h16v6.5c0 .94-.76 1.7-1.7 1.7H3.7c-.94 0-1.7-.76-1.7-1.7z" fill="#3d8ffd"/></svg>
        <span class="nm">下载</span>
        <span style="flex:1"></span>
        <span class="pt">~/Downloads</span>
      </div>

      <div class="row" style="opacity:.45">
        <span style="width:18px;height:18px;border-radius:5px;background:#6b6f78;color:#fff;display:grid;place-items:center;font-size:9.5px;font-weight:700;flex:none">Ps</span>
        <span class="nm">Photoshop</span>
        <span style="flex:1"></span>
        <span class="pt" title="面板上下文下应用项不可用——文件面板里没有「启动应用」这个动作">面板内不可用</span>
      </div>
    </div>

    <div style="display:flex;align-items:center;gap:7px;padding:7px 11px;border-top:.5px solid var(--sep)">
      <span class="kbd">↩</span>
      <span style="font-size:11px;color:var(--fg3)">跳转到此</span>
      <span style="flex:1"></span>
      <span style="font-size:11px;color:var(--fg2)" title="面板尺寸已记住：AXWindow 型面板即时套用，Chrome 这类 sheet 型面板下次打开生效">尺寸 1360×880 已记住</span>
    </div>
  </div>
</div>
