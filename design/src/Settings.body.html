<div class="{{themeClass}}" style="position:relative;width:760px;height:560px;overflow:hidden">
  <div class="wall" style="opacity:.85"></div>

  <div style="position:absolute;left:30px;top:28px;width:700px;height:504px;border-radius:12px;background:var(--win);border:.5px solid var(--win-brd);box-shadow:0 26px 60px rgba(0,0,0,.34);display:flex;flex-direction:column;overflow:hidden">

    <!-- 标题栏：整幅窗宽，侧栏在它下面 -->
    <div style="display:flex;align-items:center;gap:9px;height:48px;padding:0 18px;border-bottom:.5px solid var(--sep);flex:none">
      <span style="width:11px;height:11px;border-radius:6px;background:#ff5f57"></span>
      <span style="width:11px;height:11px;border-radius:6px;background:#febc2e"></span>
      <span style="width:11px;height:11px;border-radius:6px;background:#28c840"></span>
      <span style="margin-left:12px;font-size:14px;font-weight:600">QuickBar 设置</span>
    </div>

    <div style="flex:1;display:flex;min-height:0">
      <!-- 侧栏：固定宽度、贴边、不可折叠 -->
      <div style="width:172px;background:var(--side);border-right:.5px solid var(--sep);padding:8px;display:flex;flex-direction:column;gap:2px">
        <div class="row" style="height:28px;background:var(--accent);color:var(--on-accent)">
          <svg width="17" height="17" viewBox="0 0 16 16" fill="none" style="flex:none"><path d="M2.5 4.6c0-.7.56-1.26 1.25-1.26h2.3c.33 0 .65.13.88.37l.6.6c.24.23.56.37.89.37h4.33c.69 0 1.25.56 1.25 1.25v5.9c0 .7-.56 1.26-1.25 1.26H3.75c-.69 0-1.25-.56-1.25-1.25z" stroke="#fff" stroke-width="1.4"/></svg>
          <span style="font-size:13px">条目</span>
        </div>
        <div class="row" style="height:28px">
          <svg width="17" height="17" viewBox="0 0 16 16" fill="none" style="flex:none"><path d="M3.4 3.4a6.5 6.5 0 0 0 0 9.2" stroke="var(--fg2)" stroke-width="1.4" stroke-linecap="round"/><circle cx="8.6" cy="8" r="1.8" fill="var(--fg2)"/><path d="M11.6 5a4.2 4.2 0 0 1 0 6" stroke="var(--fg2)" stroke-width="1.4" stroke-linecap="round"/></svg>
          <span style="font-size:13px;color:var(--fg)">触发</span>
        </div>
        <div class="row" style="height:28px">
          <svg width="17" height="17" viewBox="0 0 16 16" fill="none" style="flex:none"><path d="M8 1.8 13.2 4v3.7c0 3.2-2.1 5.6-5.2 6.5-3.1-.9-5.2-3.3-5.2-6.5V4z" stroke="var(--fg2)" stroke-width="1.4" stroke-linejoin="round"/></svg>
          <span style="font-size:13px;color:var(--fg)">权限</span>
        </div>
        <div class="row" style="height:28px">
          <svg width="17" height="17" viewBox="0 0 16 16" fill="none" style="flex:none"><circle cx="8" cy="8" r="2.3" stroke="var(--fg2)" stroke-width="1.4"/><path d="M8 1.6v1.8M8 12.6v1.8M14.4 8h-1.8M3.4 8H1.6M12.5 3.5l-1.3 1.3M4.8 11.2l-1.3 1.3M12.5 12.5l-1.3-1.3M4.8 4.8 3.5 3.5" stroke="var(--fg2)" stroke-width="1.4" stroke-linecap="round"/></svg>
          <span style="font-size:13px;color:var(--fg)">通用</span>
        </div>
      </div>

      <!-- 内容 -->
      <div style="flex:1;display:flex;flex-direction:column;min-width:0">
        <div style="display:flex;align-items:center;gap:10px;height:44px;padding:0 16px;border-bottom:.5px solid var(--sep);flex:none">
          <span style="font-size:13px;font-weight:600">条目</span>
          <span style="font-size:11.5px;color:var(--fg2)" title="快捷条按这个顺序显示，拖动可以排序">4 个文件夹 · 3 个应用</span>
          <span style="font-size:11.5px;font-weight:600;color:var(--warn)" title="外置盘没接上时也会这样。只标记不删除，接回去自动恢复">1 项找不到</span>
          <span style="flex:1"></span>
        </div>

        <div style="flex:1;padding:4px 0;overflow:hidden">
          <!-- 普通行 -->
          <div class="row" style="height:36px;padding:0 16px;border-radius:0">
            <svg width="19" height="19" viewBox="0 0 20 20" style="flex:none"><path d="M2 5.9c0-.94.76-1.7 1.7-1.7h3.2c.45 0 .88.18 1.2.5l.85.85c.32.32.75.5 1.2.5h6.1c.94 0 1.7.76 1.7 1.7v.55H2z" fill="#7fb4ff"/><path d="M2 7.6h16v6.5c0 .94-.76 1.7-1.7 1.7H3.7c-.94 0-1.7-.76-1.7-1.7z" fill="#3d8ffd"/></svg>
            <span style="font-size:13px">下载</span>
            <span style="flex:1"></span>
            <span class="pt" style="max-width:210px">~/Downloads</span>
          </div>

          <!-- 悬停：铅笔和「在 Finder 中显示」才出现 -->
          <div class="row" style="height:36px;padding:0 16px;border-radius:0;background:var(--hover)">
            <svg width="19" height="19" viewBox="0 0 20 20" style="flex:none"><path d="M2 5.9c0-.94.76-1.7 1.7-1.7h3.2c.45 0 .88.18 1.2.5l.85.85c.32.32.75.5 1.2.5h6.1c.94 0 1.7.76 1.7 1.7v.55H2z" fill="#7fb4ff"/><path d="M2 7.6h16v6.5c0 .94-.76 1.7-1.7 1.7H3.7c-.94 0-1.7-.76-1.7-1.7z" fill="#3d8ffd"/></svg>
            <span style="font-size:13px">素材库</span>
            <span style="flex:1"></span>
            <span style="display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px" title="重命名——只改快捷条上的显示名，不动文件夹本身">
              <svg width="13" height="13" viewBox="0 0 16 16" fill="none"><path d="M11.2 2.4 13.6 4.8 5.6 12.8 2.4 13.6 3.2 10.4z" stroke="var(--fg2)" stroke-width="1.4" stroke-linejoin="round"/></svg>
            </span>
            <span style="display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px" title="在 Finder 中显示">
              <svg width="13" height="13" viewBox="0 0 16 16" fill="none"><path d="M9.5 2.5H13v3.5M13 2.5 7.5 8" stroke="var(--fg2)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M12.4 9.6v3a1 1 0 0 1-1 1H3.5a1 1 0 0 1-1-1V4.7a1 1 0 0 1 1-1h3" stroke="var(--fg2)" stroke-width="1.4" stroke-linecap="round"/></svg>
            </span>
            <span class="pt" style="max-width:190px">~/Work/素材库</span>
          </div>

          <!-- 改名中：双击名字或点铅笔进入，点别处即提交 -->
          <div class="row" style="height:36px;padding:0 16px;border-radius:0">
            <svg width="19" height="19" viewBox="0 0 20 20" style="flex:none"><path d="M2 5.9c0-.94.76-1.7 1.7-1.7h3.2c.45 0 .88.18 1.2.5l.85.85c.32.32.75.5 1.2.5h6.1c.94 0 1.7.76 1.7 1.7v.55H2z" fill="#7fb4ff"/><path d="M2 7.6h16v6.5c0 .94-.76 1.7-1.7 1.7H3.7c-.94 0-1.7-.76-1.7-1.7z" fill="#3d8ffd"/></svg>
            <span style="display:inline-flex;align-items:center;height:22px;padding:0 8px;min-width:190px;border-radius:6px;background:var(--field);border:.5px solid var(--accent);font-size:13px" title="重命名只改显示名，磁盘上的文件夹不受影响">秋季新品<span style="width:1px;height:14px;margin-left:1px;background:var(--accent)"></span></span>
            <span style="flex:1"></span>
            <span class="pt" style="max-width:190px">~/Work/秋季新品</span>
          </div>

          <!-- 应用：绿点=已在运行，点它是切前台不是重开 -->
          <div class="row" style="height:36px;padding:0 16px;border-radius:0">
            <span style="width:19px;height:19px;border-radius:5px;background:#3ba55d;color:#fff;display:grid;place-items:center;font-size:10px;font-weight:700;flex:none">微</span>
            <span style="font-size:13px">微信</span>
            <span style="width:6px;height:6px;border-radius:3px;background:var(--ok);flex:none" title="已在运行"></span>
            <span style="flex:1"></span>
            <span class="pt" style="max-width:210px">/Applications/WeChat.app</span>
          </div>

          <!-- 找不到：只标记不删除 -->
          <div class="row" style="height:36px;padding:0 16px;border-radius:0">
            <span style="width:19px;height:19px;border-radius:5px;background:var(--hover);flex:none"></span>
            <span style="font-size:13px;color:var(--fg2)">归档</span>
            <span style="width:6px;height:6px;border-radius:3px;background:var(--warn);flex:none"></span>
            <span style="font-size:11.5px;color:var(--warn)" title="外置盘接回去就自动恢复，条目不会被删掉">「备份盘」未挂载</span>
            <span style="flex:1"></span>
            <span class="pt" style="max-width:150px">/备份盘/归档</span>
          </div>
        </div>

        <div style="display:flex;align-items:center;gap:6px;padding:8px 14px;border-top:.5px solid var(--sep);flex:none">
          <span style="display:inline-flex;align-items:center;justify-content:center;width:30px;height:22px;border-radius:6px;background:var(--field);border:.5px solid var(--field-brd);font-size:14px;color:var(--fg2)" title="添加文件夹或应用">+</span>
          <span style="display:inline-flex;align-items:center;justify-content:center;width:30px;height:22px;border-radius:6px;background:var(--field);border:.5px solid var(--field-brd);font-size:14px;color:var(--fg3)">−</span>
          <span style="flex:1"></span>
          <span style="font-size:11px;color:var(--fg3)">也可以把文件夹或应用直接拖进来</span>
        </div>
      </div>
    </div>
  </div>
</div>
