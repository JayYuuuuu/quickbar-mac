<div class="{{themeClass}}" style="position:relative;width:560px;height:420px;overflow:hidden">
  <div class="wall"></div>

  <!-- 菜单栏 -->
  <div style="position:absolute;left:0;right:0;top:0;height:28px;background:var(--bar);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-bottom:.5px solid var(--sep);display:flex;align-items:center;padding:0 12px;gap:14px">
    <span style="font-size:12.5px;font-weight:600">Finder</span>
    <span style="font-size:12.5px;color:var(--fg2)">文件</span>
    <span style="font-size:12.5px;color:var(--fg2)">编辑</span>
    <span style="flex:1"></span>

    <!-- QuickBar 菜单栏图标（激活态） -->
    <span style="display:inline-flex;align-items:center;justify-content:center;width:26px;height:20px;border-radius:5px;background:var(--accent)">
      <svg width="15" height="15" viewBox="0 0 16 16" fill="none">
        <rect x="2.5" y="3.6" width="7" height="1.8" rx=".9" fill="#fff"/>
        <rect x="2.5" y="7.1" width="9.5" height="1.8" rx=".9" fill="#fff" opacity=".8"/>
        <rect x="2.5" y="10.6" width="5.5" height="1.8" rx=".9" fill="#fff" opacity=".6"/>
        <path d="M11.4 10.1 13.5 12l-2.1 1.9" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </span>

    <svg width="16" height="12" viewBox="0 0 16 12" fill="none" style="opacity:.65"><path d="M1 4.2a10 10 0 0 1 14 0M3.4 6.8a6.6 6.6 0 0 1 9.2 0M6 9.4a3 3 0 0 1 4 0" stroke="var(--fg)" stroke-width="1.4" stroke-linecap="round"/></svg>
    <svg width="22" height="11" viewBox="0 0 24 12" fill="none" style="opacity:.65"><rect x=".8" y=".8" width="19" height="10.4" rx="3" stroke="var(--fg)" stroke-width="1.2"/><rect x="2.6" y="2.6" width="13" height="6.8" rx="1.6" fill="var(--fg)"/><path d="M21.6 4.4v3.2" stroke="var(--fg)" stroke-width="1.6" stroke-linecap="round"/></svg>
    <span style="font-size:12px;color:var(--fg)">周四 15:52</span>
  </div>

  <!-- 下拉菜单 -->
  <div style="position:absolute;right:64px;top:34px;width:238px;border-radius:11px;background:var(--glass);backdrop-filter:blur(34px) saturate(1.8);-webkit-backdrop-filter:blur(34px) saturate(1.8);border:.5px solid var(--glass-brd);box-shadow:var(--shadow);padding:5px;overflow:hidden">
    <div style="height:1px;background:var(--glass-top);margin:-5px -5px 4px"></div>

    <div class="row" style="height:24px;padding:0 9px;background:var(--accent);color:var(--on-accent)">
      <span style="font-size:12.5px;">唤出快捷条</span>
    </div>
    <div class="row" style="height:24px;padding:0 9px">
      <span style="font-size:12.5px;">暂停触发</span>
    </div>
    <div class="row" style="height:24px;padding:0 9px">
      <span style="font-size:12.5px;">跳到 Finder 当前</span>
    </div>
    <div style="height:.5px;background:var(--sep);margin:4px 9px"></div>
    <div class="row" style="height:24px;padding:0 9px">
      <span style="font-size:12.5px;">设置…</span><span style="flex:1"></span><span style="font-size:12px;color:var(--fg3)">⌘,</span>
    </div>
    <div class="row" style="height:24px;padding:0 9px" title="辅助功能、输入监控、自动化（Finder）都已授权。任何一项掉了这里会变橙色">
      <span style="width:6px;height:6px;border-radius:4px;background:var(--ok);flex:none"></span><span style="font-size:12.5px;color:var(--fg2)">权限正常</span>
    </div>
    <div style="height:.5px;background:var(--sep);margin:4px 9px"></div>
    <div class="row" style="height:24px;padding:0 9px">
      <span style="font-size:12.5px;">检查更新</span>
    </div>
    <div class="row" style="height:24px;padding:0 9px">
      <span style="font-size:12.5px;color:var(--fg2)">版本 1.4.0</span>
    </div>
    <div style="height:.5px;background:var(--sep);margin:4px 9px"></div>
    <div class="row" style="height:24px;padding:0 9px">
      <span style="font-size:12.5px;">退出 QuickBar</span><span style="flex:1"></span><span style="font-size:12px;color:var(--fg3)">⌘Q</span>
    </div>
  </div>
</div>
