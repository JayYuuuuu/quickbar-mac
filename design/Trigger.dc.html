<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    *{box-sizing:border-box}
    body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC",system-ui,sans-serif;-webkit-font-smoothing:antialiased;font-size:13px;letter-spacing:-0.01em}
    a{color:#0a6cff}
    a:hover{color:#0850c4}
    .qb a{color:var(--accent)}
    .qb{
      --wall-a:#b9c6d4;--wall-b:#e4dcd1;--wall-c:#8fa3b8;
      --glass:rgba(249,249,251,.78);--glass-brd:rgba(0,0,0,.10);--glass-top:rgba(255,255,255,.7);
      --win:#f5f5f7;--win-brd:rgba(0,0,0,.13);--side:rgba(237,237,241,.72);--bar:rgba(246,246,248,.88);
      --fg:#17171a;--fg2:#77777f;--fg3:#a9a9b1;
      --sep:rgba(0,0,0,.08);--hover:rgba(0,0,0,.05);
      --accent:#0a6cff;--accent-soft:rgba(10,108,255,.13);--on-accent:#fff;
      --field:rgba(255,255,255,.92);--field-brd:rgba(0,0,0,.14);
      --ok:#28a54c;--warn:#e08c1a;
      --shadow:0 24px 56px rgba(18,20,26,.28),0 2px 6px rgba(18,20,26,.14);
      color:var(--fg);
    }
    .qb.dark{
      --wall-a:#2a3542;--wall-b:#3b352d;--wall-c:#161c25;
      --glass:rgba(45,45,50,.8);--glass-brd:rgba(255,255,255,.13);--glass-top:rgba(255,255,255,.12);
      --win:#1f1f23;--win-brd:rgba(255,255,255,.11);--side:rgba(37,37,42,.74);--bar:rgba(40,40,45,.88);
      --fg:#f2f2f5;--fg2:#9b9ba3;--fg3:#6d6d76;
      --sep:rgba(255,255,255,.085);--hover:rgba(255,255,255,.07);
      --accent:#3b82ff;--accent-soft:rgba(59,130,255,.2);--on-accent:#fff;
      --field:rgba(255,255,255,.07);--field-brd:rgba(255,255,255,.14);
      --ok:#35c25f;--warn:#f0a63c;
      --shadow:0 28px 64px rgba(0,0,0,.6),0 2px 8px rgba(0,0,0,.45);
    }
    .wall{position:absolute;inset:0;background:
      radial-gradient(90% 70% at 16% 8%, var(--wall-b) 0%, transparent 58%),
      radial-gradient(80% 65% at 88% 14%, var(--wall-a) 0%, transparent 62%),
      linear-gradient(158deg, var(--wall-c) 0%, var(--wall-a) 52%, var(--wall-b) 100%)}
    .row{display:flex;align-items:center;gap:8px;height:28px;padding:0 8px;border-radius:7px}
    .grp{font-size:10.5px;font-weight:600;color:var(--fg3);padding:8px 9px 3px;letter-spacing:.02em}
    .kbd{display:inline-flex;align-items:center;justify-content:center;min-width:17px;height:17px;padding:0 4px;border-radius:4px;background:var(--hover);color:var(--fg2);font-size:10.5px;font-weight:500}
    .nm{font-size:13px;white-space:nowrap}
    .pt{font-size:11px;color:var(--fg2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:158px}
    .sec{font-size:11px;font-weight:600;color:var(--fg2);padding:0 0 8px 2px}
    .card{background:var(--field);border:.5px solid var(--field-brd);border-radius:9px}
  </style>
</helmet>
<div class="{{themeClass}}" style="position:relative;width:760px;height:600px;overflow:hidden">
  <div class="wall" style="opacity:.85"></div>

  <div style="position:absolute;left:30px;top:28px;width:700px;height:544px;border-radius:12px;background:var(--win);border:.5px solid var(--win-brd);box-shadow:0 26px 60px rgba(0,0,0,.4);display:flex;overflow:hidden">

    <div style="width:172px;background:var(--side);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-right:.5px solid var(--sep);display:flex;flex-direction:column;padding:0 8px 8px">
      <div style="display:flex;align-items:center;gap:8px;height:44px;padding:0 4px">
        <span style="width:9px;height:9px;border-radius:5px;background:#ff5f57"></span>
        <span style="width:9px;height:9px;border-radius:5px;background:#febc2e"></span>
        <span style="width:9px;height:9px;border-radius:5px;background:#28c840"></span>
      </div>
      <div style="display:flex;flex-direction:column;gap:2px;margin-top:6px">
        <div class="row" style="height:30px">
          <span style="width:19px;height:19px;border-radius:5px;background:#3d8ffd;display:grid;place-items:center;flex:none">
            <svg width="12" height="12" viewBox="0 0 16 16" fill="none"><path d="M2.5 4.6c0-.7.56-1.26 1.25-1.26h2.3c.33 0 .65.13.88.37l.6.6c.24.23.56.37.89.37h4.33c.69 0 1.25.56 1.25 1.25v5.9c0 .7-.56 1.26-1.25 1.26H3.75c-.69 0-1.25-.56-1.25-1.25z" fill="#fff"/></svg>
          </span>
          <span style="font-size:12.5px">条目</span>
        </div>
        <div class="row" style="height:30px;background:var(--accent);color:var(--on-accent)">
          <span style="width:19px;height:19px;border-radius:5px;background:rgba(255,255,255,.28);display:grid;place-items:center;flex:none;color:#fff;font-size:10px;font-weight:700">⌥</span>
          <span style="font-size:12.5px">触发</span>
        </div>
        <div class="row" style="height:30px">
          <span style="width:19px;height:19px;border-radius:5px;background:#d4913f;display:grid;place-items:center;flex:none">
            <svg width="11" height="11" viewBox="0 0 16 16" fill="none"><path d="M8 1.8 13.2 4v3.7c0 3.2-2.1 5.6-5.2 6.5-3.1-.9-5.2-3.3-5.2-6.5V4z" stroke="#fff" stroke-width="1.5" stroke-linejoin="round"/></svg>
          </span>
          <span style="font-size:12.5px">权限</span>
          <span style="flex:1"></span>
          <span style="width:6px;height:6px;border-radius:4px;background:var(--warn)" title="有 1 项权限未授权"></span>
        </div>
        <div class="row" style="height:30px">
          <span style="width:19px;height:19px;border-radius:5px;background:#7c828c;display:grid;place-items:center;flex:none">
            <svg width="11" height="11" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="2.3" stroke="#fff" stroke-width="1.5"/><path d="M8 1.6v1.8M8 12.6v1.8M14.4 8h-1.8M3.4 8H1.6M12.5 3.5l-1.3 1.3M4.8 11.2l-1.3 1.3M12.5 12.5l-1.3-1.3M4.8 4.8 3.5 3.5" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/></svg>
          </span>
          <span style="font-size:12.5px">通用</span>
        </div>
      </div>
    </div>

    <div style="flex:1;display:flex;flex-direction:column;min-width:0">
      <div style="display:flex;align-items:center;gap:10px;height:44px;padding:0 16px;border-bottom:.5px solid var(--sep)">
        <span style="font-size:13px;font-weight:600">触发</span>
        <span style="flex:1"></span>
      </div>

      <div style="flex:1;padding:14px 16px;display:flex;flex-direction:column;gap:16px;overflow:hidden">

        <!-- 触发方式 -->
        <div>
          <div class="sec">唤出快捷条</div>
          <div class="card" style="padding:4px">
            <div class="row" style="height:32px;gap:9px">
              <span style="width:14px;height:14px;border-radius:8px;background:var(--accent);display:grid;place-items:center;flex:none"><span style="width:5px;height:5px;border-radius:3px;background:#fff"></span></span>
              <span style="font-size:12.5px">修饰键 + 双击</span>
              <span style="flex:1"></span>
              <span style="display:flex;padding:2px;border-radius:7px;background:var(--hover);gap:2px" title="按住这个键再双击才会弹出快捷条">
                <span style="display:inline-flex;align-items:center;justify-content:center;width:26px;height:20px;border-radius:5px;background:var(--accent);color:var(--on-accent);font-size:11px;font-weight:600">⌥</span>
                <span style="display:inline-flex;align-items:center;justify-content:center;width:26px;height:20px;border-radius:5px;font-size:11px;color:var(--fg2)">⌃</span>
                <span style="display:inline-flex;align-items:center;justify-content:center;width:26px;height:20px;border-radius:5px;font-size:11px;color:var(--fg2)">⌘</span>
                <span style="display:inline-flex;align-items:center;justify-content:center;width:26px;height:20px;border-radius:5px;font-size:11px;color:var(--fg2)">fn</span>
              </span>
            </div>
            <div style="height:.5px;background:var(--sep);margin:0 8px"></div>
            <div class="row" style="height:32px;gap:9px">
              <span style="width:14px;height:14px;border-radius:8px;border:1.2px solid var(--fg3);flex:none"></span>
              <span style="font-size:12.5px;color:var(--fg2)">双击桌面空白处</span>
              <span style="flex:1"></span>
              <span style="font-size:11px;color:var(--fg3)" title="最安全，但别的 app 全屏时用不了，得先回桌面">仅桌面</span>
            </div>
            <div style="height:.5px;background:var(--sep);margin:0 8px"></div>
            <div class="row" style="height:32px;gap:9px">
              <span style="width:14px;height:14px;border-radius:8px;border:1.2px solid var(--fg3);flex:none"></span>
              <span style="font-size:12.5px;color:var(--fg2)">裸双击任意位置</span>
              <span style="flex:1"></span>
              <span style="display:inline-flex;align-items:center;gap:4px;padding:0 7px;height:18px;border-radius:5px;background:rgba(224,140,26,.16);color:var(--warn);font-size:10.5px;font-weight:600" title="双击在 macOS 里到处有语义：文本选词、Finder 打开、标题栏最大化。开这个必然会误触发，只能靠排除名单缓解">易误触发</span>
            </div>
            <div style="height:.5px;background:var(--sep);margin:0 8px"></div>
            <div class="row" style="height:32px;gap:9px">
              <span style="width:14px;height:14px;border-radius:8px;border:1.2px solid var(--fg3);flex:none"></span>
              <span style="font-size:12.5px;color:var(--fg2)">双击 ⌘ 键</span>
              <span style="flex:1"></span>
              <span style="font-size:11px;color:var(--fg3)" title="完全不碰鼠标事件，零冲突；弹出位置跟随鼠标或屏幕中央">不碰鼠标</span>
            </div>
          </div>
        </div>

        <!-- 快捷键 -->
        <div>
          <div class="sec">快捷键</div>
          <div class="card" style="padding:4px">
            <div class="row" style="height:36px">
              <span style="font-size:12.5px">跳到 Finder 当前文件夹</span>
              <span style="flex:1"></span>
              <span style="display:inline-flex;align-items:center;justify-content:center;min-width:52px;height:24px;padding:0 10px;border-radius:6px;background:var(--accent-soft);border:.5px solid var(--accent);color:var(--accent);font-size:12px;font-weight:600" title="只在检测到文件面板时才拦截；其他场合 ⌘G 仍然是各 app 的「查找下一个」">⌘G</span>
              <span style="display:inline-flex;align-items:center;justify-content:center;height:24px;padding:0 11px;border-radius:6px;background:var(--field);border:.5px solid var(--field-brd);font-size:11.5px;color:var(--fg2)">更改</span>
            </div>
            <div style="height:.5px;background:var(--sep);margin:0 8px"></div>
            <div class="row" style="height:36px">
              <span style="font-size:12.5px;color:var(--fg2)">用快捷键唤出快捷条</span>
              <span style="flex:1"></span>
              <span style="display:inline-flex;align-items:center;justify-content:center;min-width:52px;height:24px;padding:0 10px;border-radius:6px;background:var(--field);border:.5px dashed var(--field-brd);font-size:11.5px;color:var(--fg3)">未设置</span>
              <span style="display:inline-flex;align-items:center;justify-content:center;height:24px;padding:0 11px;border-radius:6px;background:var(--field);border:.5px solid var(--field-brd);font-size:11.5px;color:var(--fg2)">录制</span>
            </div>
          </div>
        </div>

        <!-- 权限 -->
        <div>
          <div class="sec">权限</div>
          <div class="card" style="padding:4px">
            <div class="row" style="height:34px">
              <span style="width:7px;height:7px;border-radius:4px;background:var(--ok);flex:none"></span>
              <span style="font-size:12.5px">辅助功能</span>
              <span style="flex:1"></span>
              <span style="font-size:11.5px;color:var(--fg2)" title="没有它就读不到文件面板、也改不了窗口尺寸">已授权</span>
            </div>
            <div style="height:.5px;background:var(--sep);margin:0 8px"></div>
            <div class="row" style="height:34px">
              <span style="width:7px;height:7px;border-radius:4px;background:var(--ok);flex:none"></span>
              <span style="font-size:12.5px">输入监控</span>
              <span style="flex:1"></span>
              <span style="font-size:11.5px;color:var(--fg2)" title="没有它就收不到 ⌥双击 和 ⌘G">已授权</span>
            </div>
            <div style="height:.5px;background:var(--sep);margin:0 8px"></div>
            <div class="row" style="height:34px">
              <span style="width:7px;height:7px;border-radius:4px;background:var(--warn);flex:none"></span>
              <span style="font-size:12.5px">自动化 · Finder</span>
              <span style="flex:1"></span>
              <span style="font-size:11.5px;color:var(--warn);font-weight:500" title="没有它就读不到「Finder 当前文件夹」，⌘G 会退回到上次记住的路径">未授权</span>
              <span style="display:inline-flex;align-items:center;justify-content:center;height:24px;padding:0 11px;border-radius:6px;background:var(--accent);color:var(--on-accent);font-size:11.5px;font-weight:500">授权</span>
            </div>
          </div>
        </div>

        <!-- 启动 -->
        <div class="card" style="padding:4px">
          <div class="row" style="height:34px">
            <span style="font-size:12.5px">开机自动启动，静默运行</span>
            <span style="flex:1"></span>
            <span style="width:38px;height:22px;border-radius:12px;background:var(--accent);display:flex;align-items:center;padding:2px;justify-content:flex-end" title="用 SMAppService 注册，不写 LaunchAgent plist"><span style="width:18px;height:18px;border-radius:10px;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.3)"></span></span>
          </div>
          <div style="height:.5px;background:var(--sep);margin:0 8px"></div>
          <div class="row" style="height:34px">
            <span style="font-size:12.5px">记住文件面板尺寸</span>
            <span style="flex:1"></span>
            <span style="font-size:11px;color:var(--fg3)" title="普通面板即时套用；Chrome 这类 sheet 型面板由系统偏好承载，下次打开生效">1360×880</span>
            <span style="width:38px;height:22px;border-radius:12px;background:var(--accent);display:flex;align-items:center;padding:2px;justify-content:flex-end"><span style="width:18px;height:18px;border-radius:10px;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.3)"></span></span>
          </div>
        </div>

      </div>
    </div>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"dark": {"editor": "boolean", "default": true, "section": "外观"}, "$preview": {"width": 760, "height": 600}}'>
class Component extends DCLogic {
  renderVals() {
    return { themeClass: this.props.dark ? 'qb dark' : 'qb' };
  }
}
</script>
</body>
</html>
